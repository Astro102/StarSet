<style>
:root{
  --panel:rgba(8,13,22,.84); --line:rgba(120,200,255,.16); --line2:rgba(120,200,255,.32);
  --amber:#ffb547; --cyan:#5fd8ff; --text:#dfe8f3; --muted:#8494aa;
  --mono:'Orbitron',sans-serif; --sans:'Orbitron',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;color:var(--text);font-family:var(--sans);background:#000}
button,input{font:inherit;color:inherit} button{background:none;border:0;cursor:pointer}
#space{position:fixed;inset:0;background:#01030a url(tex/eso_sky.jpg) center/cover no-repeat;filter:brightness(.55)}
#map{position:fixed;inset:0}
.maplibregl-canvas{outline:none}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* left rail (Google Earth style) */
#rail{position:fixed;left:12px;top:12px;bottom:12px;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;z-index:5}
.rb{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#b9c6d6;position:relative}
.rb:hover{background:rgba(255,255,255,.07);color:#fff}
.rb.on{background:rgba(95,216,255,.14);color:var(--cyan)}
.rb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#0b111c;border:1px solid var(--line2);padding:5px 9px;border-radius:6px;font-size:12px;color:var(--text);pointer-events:none}
.rsep{width:30px;height:1px;background:var(--line);margin:4px 0}
#rail .home{margin-bottom:6px}
#rail .home i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9fd0ff,#2f74c9 50%,#0b2a55);box-shadow:0 0 10px rgba(95,170,255,.6)}
#rail .grow{flex:1}

/* search panel */
#searchP{position:fixed;left:82px;top:12px;width:min(380px,calc(100% - 96px));padding:10px;z-index:6}
#searchP .row{display:flex;gap:8px;align-items:center}
#q{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line2);background:rgba(255,255,255,.05);outline:none;font-size:14px}
#q:focus{border-color:var(--cyan)}
#qGo{padding:9px 12px;border-radius:9px;background:var(--amber);color:#1a1205;font-family:var(--mono);font-size:12px;font-weight:600}
#res{margin-top:8px;max-height:46vh;overflow:auto;display:none}
#res.on{display:block}
#res button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.5px;line-height:1.35}
#res button:hover{background:rgba(95,216,255,.1)}
#res small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
#res .msg{padding:8px 10px;font-size:13px;color:#aab7c7}

/* layers panel */
#layersP{position:fixed;left:82px;top:12px;width:300px;padding:14px;z-index:6;display:none}
#layersP.on{display:block}
#layersP h3{font-size:16px;margin-bottom:10px}
.styles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.sty{border:2px solid transparent;border-radius:10px;overflow:hidden;text-align:left;background:#0b111c}
.sty.on{border-color:var(--cyan)}
.sty .pv{height:62px;background-size:cover;background-position:center}
.sty b{display:block;padding:6px 8px;font-size:12.5px;font-weight:500}
.opt{display:flex;align-items:center;justify-content:space-between;padding:7px 2px;font-size:13.5px;border-top:1px solid var(--line)}
.sw{width:36px;height:20px;border-radius:99px;background:#2a3444;position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#cfd8e3;transition:left .2s}
.sw.on{background:var(--cyan)} .sw.on::after{left:18px;background:#fff}
#layersP .note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}

/* info card */
#card{position:fixed;right:12px;top:12px;width:320px;padding:14px;z-index:6;display:none}
#card.on{display:block}
#card .x{position:absolute;right:10px;top:10px;color:var(--muted);font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 7px}
#card h3{font-size:20px;margin:4px 28px 6px 0;line-height:1.2}
#card p{font-size:13px;color:#c4cfdc;line-height:1.5}
#card .co{font-family:var(--mono);font-size:11.5px;color:var(--amber);margin-top:8px}
#card .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#card .acts a,#card .acts button{font-family:var(--mono);font-size:11px;padding:6px 9px;border:1px solid var(--line2);border-radius:6px;color:var(--text);text-decoration:none}
#card .acts a:hover,#card .acts button:hover{border-color:var(--cyan);color:var(--cyan)}

/* bottom status bar */
#status{position:fixed;right:12px;bottom:12px;display:flex;gap:14px;align-items:center;padding:7px 12px;z-index:5;font-family:var(--mono);font-size:11px;color:#aab7c7}
#status b{color:var(--amber);font-weight:500}
#attrib{position:fixed;left:82px;bottom:12px;max-width:calc(100% - 520px);font-size:10px;color:rgba(223,232,243,.55);z-index:4;line-height:1.35}
#attrib a{color:rgba(95,216,255,.75)}
#mode{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:5;padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--amber);display:none;max-width:calc(100% - 120px);text-align:center;line-height:1.4}
#mode.on{display:block}
#mode button{margin-left:8px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px}

/* offline labels */
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.82);text-shadow:0 0 4px #000,0 0 2px #000;white-space:nowrap;pointer-events:none}
.lbl.city{font-size:10.5px;text-transform:none;letter-spacing:.02em;color:#ffe2a8}
.lbl.city::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#ffcf5a;margin-right:5px;vertical-align:middle;box-shadow:0 0 4px #ffcf5a}
#map.z-lo .lbl.country.small,#map.z-lo .lbl.city,#map.z-mid .lbl.city.minor{display:none}
.me{width:16px;height:16px;border-radius:50%;background:#4fa3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(79,163,255,.25)}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--amber);transform:rotate(-45deg);border:2px solid #1a1205;box-shadow:0 2px 8px rgba(0,0,0,.5)}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02040a;z-index:20;font-family:var(--mono);color:var(--muted);transition:opacity .8s}
#load.gone{opacity:0;pointer-events:none}

@media (max-width:760px){
  #rail{top:auto;bottom:10px;left:8px;right:8px;width:auto;height:56px;flex-direction:row;justify-content:space-around;padding:0 6px}
  .rsep,#rail .grow{display:none} .rb[data-tip]:hover::after{display:none}
  #searchP,#layersP{left:8px;right:8px;top:8px;width:auto}
  #card{left:8px;right:8px;top:auto;bottom:74px;width:auto}
  #status{right:8px;bottom:74px;font-size:10px;gap:10px;padding:5px 9px}
  #attrib{left:8px;bottom:104px;max-width:calc(100% - 16px)}
  #mode{top:auto;bottom:126px;max-width:calc(100% - 16px)}
}
@media (orientation:landscape) and (max-height:500px){
  #rail{top:6px;bottom:6px;left:6px;width:50px;height:auto;flex-direction:column;justify-content:flex-start;padding:4px 0;gap:0}
  .rb{width:38px;height:38px} .rb svg{width:19px;height:19px} .rsep{display:none}
  #searchP,#layersP{left:62px;right:auto;top:6px;width:320px}
  #card{left:auto;right:6px;top:6px;bottom:auto;width:280px;max-height:calc(100% - 50px);overflow:auto}
  #status{right:6px;bottom:6px} #attrib{left:62px;bottom:6px;max-width:45%} #mode{top:6px;bottom:auto;left:62px;transform:none;max-width:calc(100% - 360px);font-size:10px}
}
</style>

<script type="module">
import * as maplibregl from './lib/maplibre-gl.js';
const $=id=>document.getElementById(id);
const ED=window.EARTHDATA;

/* ---------------- live map sources (need the open internet) ---------------- */
const SRC={
  sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19},
  places:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19},
  roads:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19},
  osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19},
  lights:{type:'raster',tiles:['https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_Black_Marble/default/2016-01-01/GoogleMapsCompatible_Level8/{z}/{y}/{x}.png'],tileSize:256,maxzoom:8},
  dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:14,encoding:'terrarium'},
};
const ATTRIB_LIVE='Imagery &amp; reference: <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics · Streets &amp; search: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Night lights: NASA Black Marble · Terrain: Mapzen/AWS Terrain Tiles · Engine: MapLibre';
const ATTRIB_OFF='Earth map: Solar System Scope (CC BY 4.0, NASA imagery) · City lights: NASA · Borders: Natural Earth · Engine: MapLibre';
const MERC=85.05112878, FULL=[[-180,MERC],[180,MERC],[180,-MERC],[-180,-MERC]];

let LIVE=false, styleName='hybrid', terrainOn=true, bordersOn=true, atmoOn=true;
try{ const p=JSON.parse(localStorage.getItem('starset.earth')||'{}'); if(p.s) styleName=p.s; if(p.t===false) terrainOn=false; if(p.b===false) bordersOn=false; if(p.a===false) atmoOn=false; }catch(e){}
const save=()=>{ try{ localStorage.setItem('starset.earth',JSON.stringify({s:styleName,t:terrainOn,b:bordersOn,a:atmoOn})); }catch(e){} };

function buildStyle(){
  const sources={ earthimg:{type:'image',url:'tex/earth_merc.jpg',coordinates:FULL}, nightimg:{type:'image',url:'tex/earth_night_merc.jpg',coordinates:FULL},
    countries:{type:'geojson',data:ED.countries,generateId:true} };
  const layers=[{id:'bg',type:'background',paint:{'background-color':'#0b2342'}}];
  if(LIVE){
    Object.assign(sources,{sat:SRC.sat,places:SRC.places,roads:SRC.roads,osm:SRC.osm,lights:SRC.lights,dem:SRC.dem});
    const s=styleName;
    if(s==='streets') layers.push({id:'osm',type:'raster',source:'osm'});
    else if(s==='night'){ layers.push({id:'base',type:'raster',source:'nightimg',paint:{'raster-opacity':1}},{id:'lights',type:'raster',source:'lights',paint:{'raster-brightness-max':1}}); }
    else { layers.push({id:'base',type:'raster',source:'earthimg',maxzoom:5},{id:'sat',type:'raster',source:'sat',paint:{'raster-fade-duration':200}});
      if(s==='hybrid') layers.push({id:'roads',type:'raster',source:'roads',minzoom:9,paint:{'raster-opacity':.9}},{id:'places',type:'raster',source:'places'}); }
  } else {
    layers.push(styleName==='night'? {id:'base',type:'raster',source:'nightimg'} : {id:'base',type:'raster',source:'earthimg'});
  }
  layers.push({id:'cfill',type:'fill',source:'countries',paint:{'fill-color':'#5fd8ff','fill-opacity':['case',['boolean',['feature-state','hover'],false],.14,0]}});
  layers.push({id:'borders',type:'line',source:'countries',layout:{visibility:bordersOn&&(!LIVE||styleName==='satellite'||styleName==='night')?'visible':'none'},
    paint:{'line-color':'rgba(255,255,255,.55)','line-width':['interpolate',['linear'],['zoom'],1,.4,5,1.2]}});
  return { version:8, projection:{type:'globe'}, sources, layers,
    sky: atmoOn? {'sky-color':'#0a2a5a','horizon-color':'#5fa8ff','fog-color':'#bcd8ff','atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,5,1,7,0]} : {'atmosphere-blend':0} };
}

/* ---------------- start: probe whether map tiles can load here ---------------- */
function probe(){ return new Promise(res=>{ const im=new Image(); let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
  im.onload=()=>fin(true); im.onerror=()=>fin(false); setTimeout(()=>fin(false),4500);
  im.src='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/1/0/1?probe='+Date.now(); }); }
LIVE=await probe();

const map=new maplibregl.Map({ container:'map', style:buildStyle(), center:[78.9,20.6], zoom:1.6, pitch:0, maxPitch:85,
  attributionControl:false, renderWorldCopies:false, canvasContextAttributes:{antialias:true} });
window.__earth={map,isLive:()=>LIVE};
$('attrib').innerHTML=LIVE?ATTRIB_LIVE:ATTRIB_OFF;
if(!LIVE){ $('mode').innerHTML='OFFLINE GLOBE · street-level maps, satellite photos &amp; place search need StarSet opened directly in a browser (not inside a viewer)<button id="mX">✕</button>'; $('mode').classList.add('on'); $('mX').onclick=()=>$('mode').classList.remove('on'); }
$('layNote').textContent= LIVE? 'Zoom in all the way to see individual streets and buildings. Drag with two fingers (or right-drag / Ctrl-drag) to tilt.' : 'Offline mode: satellite photos, streets and night-lights detail load when StarSet is opened directly in a browser. The globe below uses StarSet’s built-in Earth map.';

/* ---------------- offline labels (HTML markers) ---------------- */
const CITIES=[['Mumbai',72.88,19.08,1],['Delhi',77.21,28.61,1],['Bengaluru',77.59,12.97,1],['Kolkata',88.36,22.57,1],['Chennai',80.27,13.08,1],['Hyderabad',78.49,17.39,1],['Pune',73.86,18.52,0],['Ahmedabad',72.57,23.02,0],['Jaipur',75.79,26.91,0],['Lucknow',80.95,26.85,0],['Guwahati',91.74,26.14,0],['Srinagar',74.8,34.08,0],['Kochi',76.27,9.93,0],['Mira Road',72.87,19.28,0],
 ['Karachi',67.01,24.86,1],['Dhaka',90.41,23.81,1],['Kathmandu',85.32,27.72,0],['Colombo',79.86,6.93,0],['Dubai',55.27,25.2,1],['Riyadh',46.68,24.71,0],['Tehran',51.39,35.69,1],['Istanbul',28.98,41.01,1],['Cairo',31.24,30.04,1],['Lagos',3.38,6.52,1],['Nairobi',36.82,-1.29,1],['Johannesburg',28.05,-26.2,1],['Cape Town',18.42,-33.92,0],
 ['London',-0.13,51.51,1],['Paris',2.35,48.86,1],['Berlin',13.4,52.52,1],['Madrid',-3.7,40.42,1],['Rome',12.5,41.9,1],['Moscow',37.62,55.76,1],['Reykjavík',-21.9,64.15,0],['Stockholm',18.07,59.33,0],
 ['New York',-74.01,40.71,1],['Los Angeles',-118.24,34.05,1],['Chicago',-87.63,41.88,0],['Toronto',-79.38,43.65,1],['Mexico City',-99.13,19.43,1],['São Paulo',-46.63,-23.55,1],['Rio de Janeiro',-43.17,-22.91,0],['Buenos Aires',-58.38,-34.6,1],['Lima',-77.04,-12.05,0],['Bogotá',-74.07,4.71,0],
 ['Beijing',116.41,39.9,1],['Shanghai',121.47,31.23,1],['Tokyo',139.65,35.68,1],['Seoul',126.98,37.57,1],['Hong Kong',114.17,22.32,0],['Bangkok',100.5,13.76,1],['Singapore',103.82,1.35,1],['Jakarta',106.85,-6.21,1],['Manila',120.98,14.6,0],['Sydney',151.21,-33.87,1],['Melbourne',144.96,-37.81,0],['Auckland',174.76,-36.85,0]];
const offMarkers=[];
function addOfflineLabels(){
  for(const [n,lon,lat,area] of ED.labels){ const el=document.createElement('div'); el.className='lbl country'+(area<25?' small':''); el.textContent=n;
    offMarkers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map)); }
  for(const [n,lon,lat,big] of CITIES){ const el=document.createElement('div'); el.className='lbl city'+(big?'':' minor'); el.textContent=n;
    offMarkers.push(new maplibregl.Marker({element:el,anchor:'left',offset:[-3,0]}).setLngLat([lon,lat]).addTo(map)); }
}
function hideFarSide(){ // markers don't know they're behind the globe: hide those beyond the visible horizon
  if(!offMarkers.length) return; const c=map.getCenter(), z=map.getZoom(), D=Math.PI/180;
  const lim=(z<2.5?84:z<4?72:60)*D, la0=c.lat*D, lo0=c.lng*D, sl=Math.sin(la0), cl=Math.cos(la0);
  for(const m of offMarkers){ const p=m.getLngLat(), la=p.lat*D; const cosd=sl*Math.sin(la)+cl*Math.cos(la)*Math.cos(p.lng*D-lo0);
    m.getElement().style.visibility= Math.acos(Math.max(-1,Math.min(1,cosd)))<lim ? 'visible':'hidden'; } }
function zoomClass(){ hideFarSide(); const z=map.getZoom(), m=$('map'); m.classList.toggle('z-lo',z<2.6); m.classList.toggle('z-mid',z>=2.6&&z<4.2); }

/* ---------------- famous places for "I'm feeling lucky" ---------------- */
const PLACES=[
 ['Taj Mahal','Agra, India',[78.0421,27.1751],17,60,-20,'A white-marble mausoleum built by Shah Jahan in memory of Mumtaz Mahal, finished around 1653.'],

];
let lastLucky=-1;
function flyPlace(i){ const p=PLACES[i]; stopSpin();
  const z=LIVE? p[3] : Math.min(p[3],5.5);
  map.flyTo({center:p[2],zoom:z,pitch:LIVE?p[4]:30,bearing:LIVE?p[5]:0,duration:LIVE?7000:4000,curve:1.6,essential:true});
  showCard({type:'Famous place',name:p[0],text:`${p[1]} — ${p[6]}`,lon:p[2][0],lat:p[2][1]}); dropPin(p[2]); }
$('bLucky').onclick=()=>{ let i; do{ i=Math.floor(Math.random()*PLACES.length); }while(i===lastLucky&&PLACES.length>1); lastLucky=i; flyPlace(i); };

/* ---------------- info card ---------------- */
let pin=null;
function dropPin(ll){ if(pin) pin.remove(); const el=document.createElement('div'); el.className='pin'; pin=new maplibregl.Marker({element:el,anchor:'bottom-left',offset:[-11,0]}).setLngLat(ll).addTo(map); }
const fmtLL=(lat,lon)=>`${Math.abs(lat).toFixed(4)}° ${lat>=0?'N':'S'}, ${Math.abs(lon).toFixed(4)}° ${lon>=0?'E':'W'}`;
function showCard(o){
  $('cType').textContent=o.type; $('cName').textContent=o.name; $('cText').textContent=o.text||''; $('cCo').textContent=o.lat!=null?fmtLL(o.lat,o.lon):'';
  const acts=[];
  if(o.lat!=null){ acts.push(`<a href="sky.html" title="Opens Tonight’s Sky">SKY FROM HERE ✦</a>`);
    acts.push(`<a href="https://www.openstreetmap.org/?mlat=${o.lat}&mlon=${o.lon}#map=17/${o.lat}/${o.lon}" target="_blank" rel="noopener">OPENSTREETMAP ↗</a>`);
    acts.push(`<button id="cCopy">COPY COORDS</button>`); }
  $('cActs').innerHTML=acts.join(''); $('card').classList.add('on');
  const sk=$('cActs').querySelector('a[href="sky.html"]');
  if(sk) sk.onclick=()=>{ try{ localStorage.setItem('starset.loc',JSON.stringify({name:o.name.slice(0,40),lat:+o.lat.toFixed(3),lon:+o.lon.toFixed(3),tz:Intl.DateTimeFormat().resolvedOptions().timeZone})); }catch(e){} };
  const cp=$('cCopy'); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(`${o.lat.toFixed(5)}, ${o.lon.toFixed(5)}`); cp.textContent='COPIED ✓'; }catch(e){ cp.textContent=`${o.lat.toFixed(4)}, ${o.lon.toFixed(4)}`; } };
}
$('cX').onclick=()=>{ $('card').classList.remove('on'); if(pin){ pin.remove(); pin=null; } };

/* ---------------- search (Nominatim / OpenStreetMap) ---------------- */
function openPanel(id){ for(const p of ['searchP','layersP']){ const el=$(p); const on=p===id&&(p==='searchP'? el.hidden : !el.classList.contains('on'));
    if(p==='searchP') el.hidden=!on; else el.classList.toggle('on',on); }
  $('bSearch').classList.toggle('on',!$('searchP').hidden); $('bLayers').classList.toggle('on',$('layersP').classList.contains('on'));
  if(!$('searchP').hidden) setTimeout(()=>$('q').focus(),30); }
$('bSearch').onclick=()=>openPanel('searchP'); $('bLayers').onclick=()=>openPanel('layersP');
addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==$('q')){ e.preventDefault(); if($('searchP').hidden) openPanel('searchP'); } if(e.key==='Escape'){ $('searchP').hidden=true; $('layersP').classList.remove('on'); $('bSearch').classList.remove('on'); $('bLayers').classList.remove('on'); } });
let lastQ=0;
async function search(){
  const q=$('q').value.trim(); if(!q) return; const R=$('res'); R.classList.add('on');
  // famous places & offline cities first (works everywhere)
  const local=[...PLACES.map((p,i)=>({name:p[0],sub:p[1],i})).filter(x=>(x.name+' '+x.sub).toLowerCase().includes(q.toLowerCase())),
               ...CITIES.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())).map(c=>({name:c[0],sub:'City',ll:[c[1],c[2]]})),
               ...ED.labels.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())).map(c=>({name:c[0],sub:'Country',ll:[c[1],c[2]],z:4}))].slice(0,5);
  const render=(remote,msg)=>{ R.innerHTML=[...local.map((x,k)=>`<button data-l="${k}">${x.name}<small>${x.sub}</small></button>`),
      ...(remote||[]).map((r,k)=>`<button data-r="${k}">${r.name||r.display_name.split(',')[0]}<small>${r.display_name}</small></button>`)].join('') + (msg?`<div class="msg">${msg}</div>`:'');
    R.querySelectorAll('button[data-l]').forEach(b=>b.onclick=()=>{ const x=local[+b.dataset.l]; R.classList.remove('on'); $('searchP').hidden=true; $('bSearch').classList.remove('on');
      if(x.i!=null) flyPlace(x.i); else { map.flyTo({center:x.ll,zoom:x.z||(LIVE?12:5.5),pitch:LIVE?45:20,duration:4500,essential:true}); showCard({type:x.sub,name:x.name,lat:x.ll[1],lon:x.ll[0]}); dropPin(x.ll); } });
    R.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{ const r=remote[+b.dataset.r]; R.classList.remove('on'); $('searchP').hidden=true; $('bSearch').classList.remove('on'); goResult(r); }); };
  if(!LIVE){ render(null, local.length? 'Street &amp; address search works when StarSet is opened directly in a browser.' : 'No match in the offline list. Street &amp; address search works when StarSet is opened directly in a browser.'); return; }
  render(null,'Searching OpenStreetMap…');
  const now=Date.now(); if(now-lastQ<1100) await new Promise(r=>setTimeout(r,1100-(now-lastQ))); lastQ=Date.now();   // Nominatim policy: max 1 request / second
  try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&addressdetails=0&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':navigator.language||'en'}});
    const js=await r.json(); render(js, js.length?'':'No places found.'); }
  catch(e){ render(null,'Search is unavailable right now.'); }
}
$('qGo').onclick=search; $('q').addEventListener('keydown',e=>{ if(e.key==='Enter') search(); e.stopPropagation(); });
function goResult(r){ stopSpin(); const ll=[+r.lon,+r.lat];
  if(r.boundingbox){ const [s,n,w,e]=r.boundingbox.map(Number); map.fitBounds([[w,s],[e,n]],{padding:80,pitch:LIVE?50:0,duration:6000,maxZoom:18}); }
  else map.flyTo({center:ll,zoom:16,pitch:50,duration:6000});
  showCard({type:(r.type||'place').replace(/_/g,' '),name:r.name||r.display_name.split(',')[0],text:r.display_name,lat:+r.lat,lon:+r.lon}); dropPin(ll); }

/* ---------------- click a spot: reverse-geocode (live) or country (offline) ---------------- */
let clickT=0;
map.on('click',async e=>{
  const {lng,lat}=e.lngLat; const f=map.queryRenderedFeatures(e.point,{layers:['cfill']})[0]; const country=f&&f.properties.name;
  if(!LIVE||map.getZoom()<5){ if(country){ showCard({type:'Country',name:country,text:LIVE?'Zoom in further and tap again to see the street address.':'Street names and addresses appear when StarSet is opened directly in a browser.',lat,lon:lng}); dropPin([lng,lat]); } return; }
  const now=Date.now(); if(now-clickT<1100) return; clickT=now;
  showCard({type:'Looking up…',name:'…',lat,lon:lng}); dropPin([lng,lat]);
  try{ const zz=Math.min(18,Math.max(10,Math.round(map.getZoom())));
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=${zz}`); const js=await r.json();
    if(js&&js.display_name){ const a=js.address||{}; const nm=js.name||a.road||a.neighbourhood||a.suburb||a.village||a.town||a.city||js.display_name.split(',')[0];
      showCard({type:(js.type||js.category||'place').replace(/_/g,' '),name:nm,text:js.display_name,lat,lon:lng}); }
    else showCard({type:'Location',name:country||'Open water',lat,lon:lng}); }
  catch(err){ showCard({type:'Location',name:country||'Unknown',lat,lon:lng}); }
});
let hoverId=null;
map.on('mousemove','cfill',e=>{ const id=e.features[0]&&e.features[0].id; if(id===hoverId) return; if(hoverId!=null) map.setFeatureState({source:'countries',id:hoverId},{hover:false}); hoverId=id; if(id!=null) map.setFeatureState({source:'countries',id},{hover:true}); map.getCanvas().style.cursor='pointer'; });
map.on('mouseleave','cfill',()=>{ if(hoverId!=null) map.setFeatureState({source:'countries',id:hoverId},{hover:false}); hoverId=null; map.getCanvas().style.cursor=''; });

/* ---------------- layers panel ---------------- */
function applyTerrain(){ if(!LIVE) return; try{ map.setTerrain(terrainOn&&styleName!=='night'?{source:'dem',exaggeration:1.35}:null); }catch(e){} }
function setStyle(n){ styleName=n; save(); document.querySelectorAll('.sty').forEach(b=>b.classList.toggle('on',b.dataset.s===n)); map.setStyle(buildStyle(),{diff:false}); map.once('styledata',applyTerrain); }
document.querySelectorAll('.sty').forEach(b=>b.onclick=()=>setStyle(b.dataset.s));
document.querySelectorAll('.sty').forEach(b=>b.classList.toggle('on',b.dataset.s===styleName));
function sw(id,get,set){ const el=$(id); const sync=()=>{ el.classList.toggle('on',get()); el.setAttribute('aria-checked',get()); }; sync();
  const f=()=>{ set(!get()); sync(); save(); }; el.onclick=f; el.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); f(); } }; }
sw('swTerrain',()=>terrainOn,v=>{ terrainOn=v; applyTerrain(); });
sw('swBorders',()=>bordersOn,v=>{ bordersOn=v; map.setStyle(buildStyle(),{diff:false}); map.once('styledata',applyTerrain); });
sw('swAtmo',()=>atmoOn,v=>{ atmoOn=v; map.setSky(buildStyle().sky); });
if(!LIVE){ document.querySelectorAll('.sty[data-s="satellite"],.sty[data-s="streets"]').forEach(b=>{ b.style.opacity=.45; b.title='Needs StarSet opened directly in a browser'; }); $('swTerrain').parentElement.style.opacity=.45; }

/* ---------------- my location, 3D, north, spin ---------------- */
let me=null;
$('bMe').onclick=()=>{
  if(!('geolocation' in navigator)){ showCard({type:'My location',name:'Not available',text:'This browser doesn’t share location.'}); return; }
  navigator.geolocation.getCurrentPosition(p=>{ const ll=[p.coords.longitude,p.coords.latitude]; stopSpin();
      if(me) me.remove(); const el=document.createElement('div'); el.className='me'; me=new maplibregl.Marker({element:el}).setLngLat(ll).addTo(map);
      map.flyTo({center:ll,zoom:LIVE?16:6,pitch:LIVE?45:0,duration:5000}); showCard({type:'You are here',name:'My location',text:`Accuracy about ${Math.round(p.coords.accuracy)} m.`,lat:ll[1],lon:ll[0]}); },
    err=>showCard({type:'My location',name:'Location blocked',text: err.code===1?'Location permission was denied — or this page is shown inside a viewer that blocks location. Open StarSet directly in your browser to use it.':'Couldn’t get your position right now.'}),
    {enableHighAccuracy:true,timeout:10000}); };
$('b3d').onclick=()=>{ stopSpin(); const tilted=map.getPitch()>10; map.easeTo({pitch:tilted?0:65,duration:1200}); };
$('bNorth').onclick=()=>map.easeTo({bearing:0,pitch:0,duration:900});
map.on('pitchend',()=>$('b3d').classList.toggle('on',map.getPitch()>10));

/* gentle auto-rotation until the user interacts (like Google Earth's intro) */
let spinning=true, spinRaf=0, lastT=0;
function spinStep(t){ if(!spinning) return; const dt=lastT? Math.min(.05,(t-lastT)/1000):0; lastT=t;
  if(map.getZoom()<4&&!map.isMoving()){ const c=map.getCenter(); c.lng-=dt*4; map.jumpTo({center:c}); } spinRaf=requestAnimationFrame(spinStep); }
function startSpin(){ spinning=true; lastT=0; $('bSpin').classList.add('on'); cancelAnimationFrame(spinRaf); spinRaf=requestAnimationFrame(spinStep); }
function stopSpin(){ spinning=false; $('bSpin').classList.remove('on'); cancelAnimationFrame(spinRaf); }
$('bSpin').onclick=()=>spinning?stopSpin():startSpin();
for(const ev of ['mousedown','touchstart','wheel']) map.getCanvasContainer().addEventListener(ev,stopSpin,{passive:true});

/* ---------------- status bar: position + eye altitude ---------------- */
function status(){ const c=map.getCenter(), z=map.getZoom(), lat=c.lat*Math.PI/180;
  const mpp=40075016.686*Math.cos(lat)/(512*Math.pow(2,z)); const eye=mpp*map.getCanvas().clientHeight/2/Math.tan((36.87/2)*Math.PI/180);
  $('sPos').textContent=fmtLL(c.lat,c.lng); $('sAlt').textContent=eye>=1000? `${Math.round(eye/1000).toLocaleString('en-IN')} km` : `${Math.round(eye)} m`; zoomClass(); }
map.on('move',status);

map.on('load',()=>{
  applyTerrain(); if(!LIVE) addOfflineLabels(); status(); $('load').classList.add('gone'); startSpin();
  const h=decodeURIComponent(location.hash.slice(1)).toLowerCase(); if(h){ const i=PLACES.findIndex(p=>p[0].toLowerCase().replace(/[^a-z]+/g,'-')===h); if(i>=0) setTimeout(()=>flyPlace(i),600); }
});
map.on('error',e=>{ if(e&&e.error&&String(e.error.message||'').match(/tile|fetch|load/i)) return; console.warn(e&&e.error); });
</script>
</body>
</html>

<style>
:root{--panel:rgba(8,13,22,.86);--line:rgba(120,200,255,.16);--line2:rgba(120,200,255,.32);--amber:#ffb547;--cyan:#5fd8ff;--text:#dfe8f3;--muted:#8494aa;
  --mono:'Orbitron',sans-serif;--sans:'Orbitron',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#01030a;color:var(--text);font-family:var(--sans)}
button,select,input{font:inherit;color:inherit} button{background:none;border:0;cursor:pointer}
#space{position:fixed;inset:0;background:#01030a url(tex/eso_sky.jpg) center/cover;filter:brightness(.5)}
#map{position:fixed;inset:0}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#top{position:fixed;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:8px 14px;z-index:6}
.nb{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-decoration:none;padding:7px 10px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}
.nb:hover{color:var(--text);border-color:var(--line2)}
#brand{font-weight:700;letter-spacing:.14em;font-size:14px;display:flex;gap:9px;align-items:center}
#brand i{width:10px;height:10px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #ffcf5a,0 0 12px #ffb547}
#brand small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.08em}
#top select{margin-left:auto;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:13px;max-width:200px}
#top select option{background:#0b111c}
#list{position:fixed;left:12px;top:70px;bottom:96px;width:280px;overflow:auto;padding:12px;z-index:5}
#list h2{font-size:15px;margin-bottom:8px}
.ec{display:block;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:9px;margin-bottom:4px}
.ec:hover{background:rgba(95,216,255,.07)} .ec.on{border-color:var(--cyan);background:rgba(95,216,255,.1)}
.ec b{display:block;font-size:14px;font-weight:600} .ec span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ec .k{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:1px 6px;border-radius:99px;margin-right:6px;vertical-align:1px}
.k.solar{background:rgba(255,181,71,.18);color:var(--amber)} .k.lunar{background:rgba(255,110,90,.16);color:#ff8f7a}
#twin{position:fixed;right:12px;top:70px;width:330px;padding:12px;z-index:5}
#twin h3{font-size:17px;margin:2px 0 8px}
#sky{width:100%;aspect-ratio:1;border-radius:10px;display:block;background:#000}
#read{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#read div{background:rgba(8,13,22,.95);padding:6px 9px} #read b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--amber);margin-top:2px}
#note{font-size:12.5px;line-height:1.5;color:#c4cfdc;margin-top:8px}
#maxBtn{margin-top:8px;font-family:var(--mono);font-size:11px;padding:7px 10px;border-radius:6px;background:var(--amber);color:#1a1205;font-weight:600}
#bar{position:fixed;left:304px;right:354px;bottom:12px;padding:10px 14px;z-index:5;display:flex;align-items:center;gap:10px}
#bar input[type=range]{flex:1;accent-color:var(--amber)}
#bar .tb{font-family:var(--mono);font-size:11px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;color:var(--muted);white-space:nowrap}
#bar .tb.on{color:#05070c;background:var(--cyan);border-color:var(--cyan)}
#tlab{font-family:var(--mono);font-size:12px;color:var(--amber);white-space:nowrap;min-width:150px;text-align:right}
#tlab small{display:block;font-size:9.5px;color:var(--muted)}
#hint{position:fixed;left:50%;top:70px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);z-index:4;text-align:center;padding:5px 10px}
.pin{width:14px;height:14px;border-radius:50%;background:var(--cyan);border:2px solid #fff;box-shadow:0 0 0 5px rgba(95,216,255,.25)}
.mk{font-family:var(--mono);font-size:10.5px;color:#fff;text-shadow:0 0 4px #000;white-space:nowrap;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02040a;z-index:20;font-family:var(--mono);color:var(--muted);transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}
@media (max-width:900px){
  #brand small,#top .nb.opt{display:none} #top select{max-width:130px}
  #list{top:auto;bottom:150px;left:8px;right:8px;width:auto;height:auto;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px}
  #list{display:block;overflow:hidden} #list h2{display:none} #ecl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none} .ec{flex:none;width:210px;margin:0}
  #twin{top:66px;right:8px;width:170px;padding:8px} #twin h3,#read,#note,#twin .tag{display:none} #maxBtn{width:100%;font-size:10px;padding:5px}
  #bar{left:8px;right:8px;bottom:8px;flex-wrap:wrap;gap:6px} #tlab{min-width:0;text-align:left;flex:1}
  #hint{display:none}
}
@media (orientation:landscape) and (max-height:500px){
  #top{top:6px;left:6px;right:6px;padding:5px 10px} #list{top:50px;bottom:56px;left:6px;width:210px;display:block;max-height:none;overflow:auto} #ecl{display:block} .ec{width:100%;margin-bottom:4px}
  #twin{top:50px;right:6px;width:200px;padding:8px} #twin h3,#read,#note{display:none}
  #bar{left:222px;right:212px;bottom:6px;padding:6px 10px;flex-wrap:nowrap}
}

const CITIES=[['Mumbai',19.076,72.878,'Asia/Kolkata'],['Delhi',28.614,77.209,'Asia/Kolkata'],['Bengaluru',12.972,77.594,'Asia/Kolkata'],['Kolkata',22.573,88.364,'Asia/Kolkata'],['Chennai',13.083,80.271,'Asia/Kolkata'],
 ['Dubai',25.205,55.271,'Asia/Dubai'],['Cairo',30.044,31.236,'Africa/Cairo'],['Luxor',25.687,32.639,'Africa/Cairo'],['Madrid',40.417,-3.704,'Europe/Madrid'],['Reykjavík',64.147,-21.94,'Atlantic/Reykjavik'],['London',51.507,-0.128,'Europe/London'],
 ['New York',40.713,-74.006,'America/New_York'],['São Paulo',-23.55,-46.633,'America/Sao_Paulo'],['Sydney',-33.869,151.209,'Australia/Sydney'],['Perth',-31.95,115.86,'Australia/Perth'],['Tokyo',35.676,139.65,'Asia/Tokyo']];
let obs={name:'Mumbai',lat:19.076,lon:72.878,tz:'Asia/Kolkata'};
try{ const s=JSON.parse(localStorage.getItem('starset.loc')||'null'); if(s&&isFinite(s.lat)) obs={name:s.name,lat:s.lat,lon:s.lon,tz:s.tz||'UTC'}; }catch(e){}
const sel=$('city'); CITIES.forEach((c,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent='Watch from '+c[0]; sel.appendChild(o); });
const oc=document.createElement('option'); oc.value='custom'; oc.textContent='Watch from: tapped spot'; sel.appendChild(oc);
function syncSel(){ const i=CITIES.findIndex(c=>c[0]===obs.name); sel.value=i>=0?i:'custom'; }
syncSel();
sel.onchange=()=>{ if(sel.value==='custom') return; const c=CITIES[+sel.value]; setObs({name:c[0],lat:c[1],lon:c[2],tz:c[3]}); };

/* ---------- country lookup (point in polygon) ---------- */
function inRing(x,y,r){ let c=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const [xi,yi]=r[i],[xj,yj]=r[j]; if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi) c=!c; } return c; }
function spansDateLine(r){ let mn=999,mx=-999; for(const [x] of r){ if(x<mn) mn=x; if(x>mx) mx=x; } return mx-mn>300; }
function countryAt(lon,lat){ for(const f of ED.countries.features){ const g=f.geometry; if(!g) continue; const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
  for(const p of polys){ let r=p[0], x=lon; if(spansDateLine(r)){ r=r.map(([a,b])=>[a<0?a+360:a,b]); x=lon<0?lon+360:lon; } if(inRing(x,lat,r)) return f.properties.name; } } return null; }

/* ---------- list of eclipses ---------- */
const list=[]; {
  let s=A.SearchGlobalSolarEclipse(A.MakeTime(new Date(Date.now()-120*86400e3)));
  for(let i=0;i<7;i++){ list.push({type:'solar',kind:s.kind,peak:s.peak.date,lat:s.latitude,lon:s.longitude}); s=A.NextGlobalSolarEclipse(s.peak); }
  let l=A.SearchLunarEclipse(A.MakeTime(new Date(Date.now()-120*86400e3)));
  for(let i=0;i<7;i++){ list.push({type:'lunar',kind:l.kind,peak:l.peak.date,sd:l.sd_penum,mag:l.obscuration}); l=A.NextLunarEclipse(l.peak); }
  list.sort((a,b)=>a.peak-b.peak);
}
const KIND={total:'Total',annular:'Annular',partial:'Partial',penumbral:'Penumbral'};
const fmtD=(d,tz)=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,day:'numeric',month:'short',year:'numeric'}).format(d);
const fmtT=(d,tz)=>new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:true}).format(d);
function where(e){ if(e.type==='lunar'){ const sp=E.subPoint('Moon',e.peak); const c=countryAt(sp.lon,sp.lat); return 'Night side of Earth · Moon overhead near '+(c||'the ocean'); }
  if(e.lat==null) return 'Partial only — near the poles'; const c=countryAt(e.lon,e.lat); return 'Greatest eclipse: '+(c||'over the ocean'); }
$('ecl').innerHTML=list.map((e,i)=>`<button class="ec" data-i="${i}"><b><span class="k ${e.type}">${e.type.toUpperCase()}</span>${KIND[e.kind]} ${e.type==='solar'?'solar':'lunar'} eclipse</b><span>${fmtD(e.peak,'UTC')}${e.peak<Date.now()?' · past':''}</span><br><span>${where(e)}</span></button>`).join('');
document.querySelectorAll('.ec').forEach(b=>b.onclick=()=>pick(+b.dataset.i));

/* ---------- globe ---------- */
const MERC=85.05112878, FULL=[[-180,MERC],[180,MERC],[180,-MERC],[-180,-MERC]];
const empty={type:'FeatureCollection',features:[]};
const map=new maplibregl.Map({container:'map',attributionControl:false,center:[60,20],zoom:1.5,
  style:{version:8,projection:{type:'globe'},sources:{earth:{type:'image',url:'tex/earth_merc.jpg',coordinates:FULL},countries:{type:'geojson',data:ED.countries},
      path:{type:'geojson',data:empty},pen:{type:'geojson',data:empty},umb:{type:'geojson',data:empty},vis:{type:'geojson',data:empty}},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#0b2342'}},{id:'earth',type:'raster',source:'earth'},
      {id:'borders',type:'line',source:'countries',paint:{'line-color':'rgba(255,255,255,.35)','line-width':.6}},
      {id:'vis-fill',type:'fill',source:'vis',paint:{'fill-color':'#5fd8ff','fill-opacity':.12}},{id:'vis-line',type:'line',source:'vis',paint:{'line-color':'#5fd8ff','line-width':1.5,'line-dasharray':[2,2]}},
      {id:'pen-fill',type:'fill',source:'pen',paint:{'fill-color':'#000','fill-opacity':.35}},{id:'pen-line',type:'line',source:'pen',paint:{'line-color':'rgba(255,190,80,.6)','line-width':1}},
      {id:'path',type:'line',source:'path',paint:{'line-color':'#ffb547','line-width':['interpolate',['linear'],['zoom'],1,2,6,6],'line-opacity':.9}},
      {id:'umb',type:'fill',source:'umb',paint:{'fill-color':'#000','fill-opacity':.9}}],
    sky:{'sky-color':'#0a2a5a','horizon-color':'#5fa8ff','fog-color':'#bcd8ff','atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,5,1,7,0]}}});
window.__ecl={map};
function circle(lat,lon,rKm,n=96){ // geodesic circle; longitudes unwrapped so it draws across the date line
  const R=6371, d=rKm/R, la=lat*D2R, lo=lon*D2R, pts=[]; let prev=null;
  for(let i=0;i<=n;i++){ const b=i/n*2*Math.PI; const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
    let lo2=(lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2)))/D2R;
    if(prev!=null){ while(lo2-prev>180) lo2-=360; while(lo2-prev<-180) lo2+=360; } prev=lo2; pts.push([lo2,la2/D2R]); }
  return pts; }
const poly=(pts,ok)=>({type:'FeatureCollection',features:ok?[{type:'Feature',geometry:{type:'Polygon',coordinates:[pts]}}]:[]});
const linefc=pts=>({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'LineString',coordinates:pts}}]});
let pinM=null;
function placePin(){ if(pinM) pinM.remove(); const el=document.createElement('div'); el.className='pin'; pinM=new maplibregl.Marker({element:el}).setLngLat([obs.lon,obs.lat]).addTo(map); }
map.on('click',e=>{ const {lng,lat}=e.lngLat; const c=countryAt(lng,lat); setObs({name:c?`${c} (${lat.toFixed(1)}°, ${lng.toFixed(1)}°)`:`${lat.toFixed(1)}°, ${lng.toFixed(1)}°`,lat,lon:lng,tz:'UTC',custom:true}); sel.value='custom'; });

/* ---------- current eclipse & time ---------- */
let cur=null, t0=0, t1=0, tNow=0, playing=false, speed=300, local=null;
function setObs(o){ obs=o; placePin(); if(cur) computeLocal(); draw(); }
function pick(i){
  cur=list[i]; document.querySelectorAll('.ec').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  const pk=cur.peak.getTime(), half=(cur.type==='solar'?3.3:Math.max(2,(cur.sd||200)/60*0.75+0.4))*3600e3;
  t0=pk-half; t1=pk+half; tNow=pk;
  if(cur.type==='solar'){ const pts=E.solarPath(new Date(t0),new Date(t1),2); let prev=null; const unw=pts.map(([lo,la])=>{ if(prev!=null){ while(lo-prev>180) lo-=360; while(lo-prev<-180) lo+=360; } prev=lo; return [lo,la]; });
      map.getSource('path').setData(unw.length>1?linefc(unw):empty); }
  else map.getSource('path').setData(empty);
  map.getSource('vis').setData(empty);
  const s=cur.type==='solar'? E.solarShadow(cur.peak) : E.subPoint('Moon',cur.peak);
  map.flyTo({center:[s.lon,Math.max(-60,Math.min(60,s.lat))],zoom:cur.type==='solar'?2:1.4,duration:2500});
  computeLocal(); draw(); history.replaceState(null,'','#'+cur.peak.toISOString().slice(0,10));
}
/* ---------- what the observer sees ---------- */
function overlap(r1,r2,d){ if(d>=r1+r2) return 0; if(d<=Math.abs(r1-r2)) return Math.PI*Math.min(r1,r2)**2;
  const a=r1*r1*Math.acos((d*d+r1*r1-r2*r2)/(2*d*r1))+r2*r2*Math.acos((d*d+r2*r2-r1*r1)/(2*d*r2))-.5*Math.sqrt((-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2)); return a; }
function topo(body,date,o){ const ob=new A.Observer(o.lat,o.lon,0); const eq=A.Equator(body,date,ob,true,true); const h=A.Horizon(date,ob,eq.ra,eq.dec,'normal'); return {ra:eq.ra*15,dec:eq.dec,dist:eq.dist*E.AU,alt:h.altitude,az:h.azimuth}; }
function solarView(date){ const s=topo('Sun',date,obs), m=topo('Moon',date,obs);
  const rs=Math.asin(E.RS/s.dist)/D2R, rm=Math.asin(E.RM/m.dist)/D2R;
  let dra=(m.ra-s.ra); if(dra>180) dra-=360; if(dra<-180) dra+=360; const dx=-dra*Math.cos(s.dec*D2R), dy=m.dec-s.dec, d=Math.hypot(dx,dy);
  const cov=overlap(rs,rm,d)/(Math.PI*rs*rs); return {s,m,rs,rm,dx,dy,d,cov,total:rm>=rs&&d<=rm-rs,annular:rm<rs&&d<=rs-rm}; }
function lunarView(date){ const L=E.lunarShadow(date), m=topo('Moon',date,obs);
  const t=A.MakeTime(date), S=A.GeoVector('Sun',t,true), M=A.GeoVector('Moon',t,true); const n=v=>{ const l=Math.hypot(v.x,v.y,v.z); return {x:v.x/l,y:v.y/l,z:v.z/l}; };
  const mv=n(M), an=n({x:-S.x,y:-S.y,z:-S.z}); let ex={x:-mv.y,y:mv.x,z:0}; const el=Math.hypot(ex.x,ex.y)||1; ex={x:ex.x/el,y:ex.y/el,z:0};
  const no={x:mv.y*ex.z-mv.z*ex.y,y:mv.z*ex.x-mv.x*ex.z,z:mv.x*ex.y-mv.y*ex.x};
  const dx=-(an.x*ex.x+an.y*ex.y+an.z*ex.z)/D2R, dy=(an.x*no.x+an.y*no.y+an.z*no.z)/D2R;
  const umbCov=overlap(L.moonRadDeg,L.umbraDeg,L.sepDeg)/(Math.PI*L.moonRadDeg**2);
  return {L,m,dx,dy,umbCov}; }
function computeLocal(){
  if(!cur) return; local={best:null,bestV:-1,start:null,end:null,visStart:null};
  for(let ms=t0;ms<=t1;ms+=60e3){ const d=new Date(ms);
    if(cur.type==='solar'){ const v=solarView(d); const ok=v.s.alt>-.5&&v.cov>0; if(ok&&local.start==null) local.start=ms; if(ok) local.end=ms; if(ok&&v.cov>local.bestV){ local.bestV=v.cov; local.best=ms; } }
    else { const v=lunarView(d); const inPen=v.L.sepDeg<v.L.penDeg+v.L.moonRadDeg, ok=v.m.alt>-.5&&inPen; if(ok&&local.start==null) local.start=ms; if(ok) local.end=ms;
      const score=v.umbCov+(inPen?.001:0); if(ok&&score>local.bestV){ local.bestV=score; local.best=ms; } } }
}
$('maxBtn').onclick=()=>{ if(local&&local.best){ tNow=local.best; draw(); } };

/* ---------- draw: globe overlays + sky window ---------- */
const cv=$('sky'), ctx=cv.getContext('2d'), moonImg=new Image(); moonImg.src='tex/moon.jpg';
function draw(){
  if(!cur) return; const d=new Date(tNow), tz=obs.tz||'UTC';
  $('t').value=Math.round((tNow-t0)/(t1-t0)*1000);
  $('tlab').innerHTML=`${fmtT(d,tz)} <small>${fmtD(d,tz)} · ${tz==='UTC'?'UTC':obs.name.split(' (')[0]} time</small>`;
  // globe
  if(cur.type==='solar'){ const s=E.solarShadow(d); const pen=circle(s.lat,s.lon,s.penKm), um=circle(s.lat,s.lon,Math.max(8,Math.abs(s.umbraKm)));
    const penOk=Math.abs(s.lat)+s.penKm/111<88; map.getSource('pen').setData(poly(pen,true)); map.getSource('umb').setData(poly(um,s.hit&&cur.kind!=='partial'));
    if(!penOk) map.getSource('pen').setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'LineString',coordinates:pen}}]}); }
  else { const sp=E.subPoint('Moon',d); map.getSource('vis').setData({type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'LineString',coordinates:circle(sp.lat,sp.lon,6371*Math.PI/2,180)}}]});
    map.getSource('pen').setData(empty); map.getSource('umb').setData(poly(circle(sp.lat,sp.lon,60),true)); }
  // sky window
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2; ctx.clearRect(0,0,W,H);
  $('twFrom').textContent='From '+obs.name;
  if(cur.type==='solar'){
    const v=solarView(d), k=W/(v.rs*5.2), up=v.s.alt>-.5;
    const dark=up? Math.pow(v.cov,6) : 1, dayB=up? Math.min(1,Math.max(0,(v.s.alt+6)/12)) : 0;
    const top=[18+60*dayB*(1-dark),40+110*dayB*(1-dark),80+150*dayB*(1-dark)], bot=[30+150*dayB*(1-dark),60+150*dayB*(1-dark),110+130*dayB*(1-dark)];
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,`rgb(${top})`); g.addColorStop(1,`rgb(${bot})`); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(up){ if(v.total){ for(let i=0;i<60;i++){ const a=i/60*Math.PI*2+.3*Math.sin(i*7), L=v.rs*k*(1.4+Math.abs(Math.sin(i*3.7))*1.4);
          ctx.strokeStyle='rgba(235,240,255,.10)'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*L,cy+Math.sin(a)*L); ctx.stroke(); }
          const cg=ctx.createRadialGradient(cx,cy,v.rs*k,cx,cy,v.rs*k*2.6); cg.addColorStop(0,'rgba(240,244,255,.85)'); cg.addColorStop(1,'rgba(240,244,255,0)'); ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,v.rs*k*2.6,0,7); ctx.fill(); }
      else { const gl=ctx.createRadialGradient(cx,cy,v.rs*k*.9,cx,cy,v.rs*k*3); gl.addColorStop(0,`rgba(255,240,200,${.6*(1-v.cov)})`); gl.addColorStop(1,'rgba(255,240,200,0)'); ctx.fillStyle=gl; ctx.fillRect(0,0,W,H); }
      const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,v.rs*k); sg.addColorStop(0,'#fffbe8'); sg.addColorStop(.8,'#ffe7a8'); sg.addColorStop(1,'#ffc066');
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(cx,cy,v.rs*k,0,7); ctx.fill();
      ctx.fillStyle='#05060a'; ctx.beginPath(); ctx.arc(cx+v.dx*k,cy-v.dy*k,v.rm*k,0,7); ctx.fill(); }
    else { ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='500 22px "Orbitron",sans-serif'; ctx.textAlign='center'; ctx.fillText('The Sun is below',cx,cy-10); ctx.fillText('the horizon here',cx,cy+22); }
    $('twTitle').textContent= !up? 'Not visible right now' : v.total? 'TOTALITY ✦' : v.annular? 'Ring of fire ◯' : v.cov>0? `${v.cov>.99?(v.cov*100).toFixed(1):Math.round(v.cov*100)}% of the Sun covered` : 'No eclipse at this moment';
    $('read').innerHTML=[['Sun altitude',`${v.s.alt.toFixed(1)}°`],['Covered now',`${v.cov>.99?(v.cov*100).toFixed(1):Math.round(v.cov*100)}%`],['Max here',local&&local.best?`${local.bestV>.99?(local.bestV*100).toFixed(1):Math.round(local.bestV*100)}% at ${fmtT(new Date(local.best),tz)}`:'not visible'],['Starts · ends',local&&local.start?`${fmtT(new Date(local.start),tz)} – ${fmtT(new Date(local.end),tz)}`:'—']].map(([a,b])=>`<div><span class="tag">${a}</span><b>${b}</b></div>`).join('');
    $('note').textContent=(local&&local.best)? 'Never look at the Sun directly — use certified eclipse glasses or a pinhole projector.' : 'The Moon’s shadow misses this place. Tap inside the dark circle on the globe to watch from somewhere that sees it.';
  } else {
    const v=lunarView(d), up=v.m.alt>-.5, R=W*.23, k=R/v.L.moonRadDeg;
    ctx.fillStyle='#03050c'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<80;i++){ const x=(i*97)%W, y=(i*233)%H; ctx.fillStyle=`rgba(255,255,255,${.2+(i%5)/10})`; ctx.fillRect(x,y,1.5,1.5); }
    if(up){ ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
      if(moonImg.complete&&moonImg.naturalWidth) ctx.drawImage(moonImg,moonImg.naturalWidth*.25,0,moonImg.naturalWidth*.5,moonImg.naturalHeight,cx-R,cy-R,2*R,2*R); else { ctx.fillStyle='#bbb'; ctx.fillRect(cx-R,cy-R,2*R,2*R); }
      const sx=cx+v.dx*k, sy=cy-v.dy*k;
      const pg=ctx.createRadialGradient(sx,sy,v.L.umbraDeg*k,sx,sy,v.L.penDeg*k); pg.addColorStop(0,'rgba(0,0,0,.55)'); pg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=pg; ctx.fillRect(cx-R,cy-R,2*R,2*R);
      ctx.globalCompositeOperation='multiply'; const ug=ctx.createRadialGradient(sx,sy,0,sx,sy,v.L.umbraDeg*k); ug.addColorStop(0,'rgb(70,14,6)'); ug.addColorStop(.85,'rgb(150,45,18)'); ug.addColorStop(1,'rgb(200,90,50)');
      ctx.fillStyle=ug; ctx.beginPath(); ctx.arc(sx,sy,v.L.umbraDeg*k,0,7); ctx.fill(); ctx.restore(); }
    else { ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='500 22px "Orbitron",sans-serif'; ctx.textAlign='center'; ctx.fillText('The Moon is below',cx,cy-10); ctx.fillText('the horizon here',cx,cy+22); }
    const st= v.umbCov>=.999?'Totality — a “blood moon”':v.umbCov>0?`${Math.round(v.umbCov*100)}% in Earth’s dark shadow`:v.L.sepDeg<v.L.penDeg+v.L.moonRadDeg?'Faint penumbral shading':'Outside Earth’s shadow';
    $('twTitle').textContent= up? st : 'Not visible right now';
    $('read').innerHTML=[['Moon altitude',`${v.m.alt.toFixed(1)}°`],['In umbra now',`${Math.round(v.umbCov*100)}%`],['Best view here',local&&local.best?fmtT(new Date(local.best),tz):'not visible'],['Visible',local&&local.start?`${fmtT(new Date(local.start),tz)} – ${fmtT(new Date(local.end),tz)}`:'—']].map(([a,b])=>`<div><span class="tag">${a}</span><b>${b}</b></div>`).join('');
    $('note').textContent='Lunar eclipses are safe to watch with the naked eye. Anyone on the night side of Earth (inside the dashed circle) can see it.';
  }
}
$('t').oninput=()=>{ tNow=t0+(t1-t0)*$('t').value/1000; draw(); };
$('play').onclick=()=>{ playing=!playing; $('play').textContent=playing?'❚❚ Pause':'▶ Play'; $('play').classList.toggle('on',playing); if(playing&&tNow>=t1) tNow=t0; };
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{ speed=+b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===b)); });
let last=performance.now(); function loop(t){ const dt=Math.min(.1,(t-last)/1000); last=t; if(playing&&cur){ tNow+=dt*speed*1000; if(tNow>=t1){ tNow=t1; playing=false; $('play').textContent='▶ Play'; $('play').classList.remove('on'); } draw(); } requestAnimationFrame(loop); }
map.on('load',()=>{ placePin(); $('load').classList.add('gone');
  const h=location.hash.slice(1); let i=list.findIndex(e=>e.peak.toISOString().slice(0,10)===h); if(i<0) i=list.findIndex(e=>e.peak>Date.now()); pick(Math.max(0,i)); requestAnimationFrame(loop);
  setTimeout(()=>$('hint').style.display='none',9000); });
</script>
